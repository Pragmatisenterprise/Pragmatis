<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pragmatis · Firma de correo</title>
<!--
  Firma de correo compatible con Gmail, Outlook y Apple Mail.
  - Solo tablas y estilos en línea (los clientes de correo ignoran <style> y CSS moderno).
  - Arial como fuente: los correos no cargan fuentes web.
  - El logo es PNG con URL absoluta: los clientes de correo no muestran SVG ni rutas relativas.
    La imagen https://pragmatis.co/email/firma-logo.png existe una vez desplegada la rama Remake.
  Uso: abre este archivo en el navegador, selecciona la firma, cópiala y pégala en la configuración de firma.
  Reemplaza los datos entre corchetes.
-->
</head>
<body style="margin:0;padding:24px;background:#ffffff;">
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="font-family:Arial,Helvetica,sans-serif;color:#0E1511;">
  <tr>
    <td style="padding:0 0 12px 0;">
      <a href="https://pragmatis.co" style="text-decoration:none;"><img src="https://pragmatis.co/email/firma-logo.png" width="150" height="27" alt="Pragmatis" style="display:block;border:0;width:150px;height:auto;"></a>
    </td>
  </tr>
  <tr>
    <td style="border-left:3px solid #1C5A43;padding:2px 0 2px 12px;">
      <div style="font-size:15px;font-weight:bold;line-height:20px;color:#0E1511;">[Nombre Apellido]</div>
      <div style="font-size:13px;line-height:18px;color:#59615A;">[Cargo] · Pragmatis</div>
      <div style="font-size:13px;line-height:20px;color:#59615A;padding-top:6px;">
        <a href="tel:+570000000000" style="color:#59615A;text-decoration:none;">[+57 300 000 0000]</a>
        &nbsp;·&nbsp;
        <a href="mailto:contacto@pragmatis.co" style="color:#1C5A43;text-decoration:none;">contacto@pragmatis.co</a>
        &nbsp;·&nbsp;
        <a href="https://pragmatis.co" style="color:#1C5A43;text-decoration:none;font-weight:bold;">pragmatis.co</a>
      </div>
    </td>
  </tr>
  <tr>
    <td style="padding-top:12px;font-size:12px;line-height:16px;color:#59615A;">Software que trabaja por tu negocio.</td>
  </tr>
</table>
</body>
</html>
